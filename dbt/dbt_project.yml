name: polaris
version: 1.0.0
config-version: 2

profile: polaris

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

require-dbt-version: [">=1.8.0", "<2.0.0"]

# Schemas are Terraform's (infra/terraform/snowflake). The dbt role can build
# inside STAGING and MARTS but can't create schemas, so +schema names one that
# already exists. macros/generate_schema_name.sql uses it as-is.
models:
  polaris:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts

# No dbt snapshots: SCD2 history is built in Silver with MERGE (ADR-0004).

vars:
  fnol_late_arrival_window_days: 7   # report more than this many days after the loss = late FNOL
  fraud_recent_policy_days: 30       # loss this soon after the policy started = fraud signal
  fraud_model_score_threshold: 0.7
