# Databricks Asset Bundle: the Silver job as code (Stage 3).
#
#   cd databricks
#   databricks bundle validate -t prod
#   databricks bundle deploy -t prod                      # uploads src/, creates/updates the job
#   databricks bundle run polaris_silver -t prod --params ingest_date=2026-10-19
#
# Logs in with your `az login` (profile "polaris" in ~/.databrickscfg).
bundle:
  name: polaris

targets:
  prod:
    default: true
    workspace:
      host: https://adb-7405611377325778.18.azuredatabricks.net
      profile: polaris

resources:
  jobs:
    polaris_silver:
      name: polaris_silver
      description: Bronze claims-system extract for one business day -> Silver Delta tables (SCD1, SCD2), with quarantine and audit.
      max_concurrent_runs: 1   # days must apply in order, like the extract's watermark
      parameters:
        - name: ingest_date
          default: "2026-10-19"
      # Serverless jobs compute: Databricks runs the task on its own managed
      # machines. The Azure Free Trial subscription can't start any VM size
      # Databricks supports (only ARM and confidential sizes are allowed), so
      # classic job clusters failed with CLOUD_PROVIDER_RESOURCE_STOCKOUT.
      # Serverless also starts in seconds and bills only while the task runs.
      environments:
        - environment_key: default
          spec:
            client: "2"
      tasks:
        - task_key: silver_claims_system
          environment_key: default
          spark_python_task:
            python_file: ./src/silver_job.py
            parameters: ["--ingest-date", "{{job.parameters.ingest_date}}"]
      tags:
        project: polaris
        stage: "3"
