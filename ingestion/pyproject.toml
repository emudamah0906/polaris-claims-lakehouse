[project]
name = "polaris-ingest"
version = "0.1.0"
description = "Polaris Stage 2: land synthetic P&C data in the Bronze layer"
requires-python = ">=3.11"
dependencies = [
    "faker>=25.0",
]

[project.scripts]
polaris-ingest = "polaris_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polaris_ingest"]
